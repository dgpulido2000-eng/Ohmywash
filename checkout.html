<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Oh My Wash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2ec4b6;
    --teal-dark:#22a89c;
    --teal-deep:#0f6a62;
    --teal-light:#7de0d4;
    --teal-pale:#e6faf7;
    --ink:#12191a;
    --paper:#ffffff;
    --off:#f4fafb;
    --shadow: 0 20px 50px rgba(20,50,55,.12);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;color:var(--ink);background:var(--off);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}

  header{
    background:#fff;border-bottom:1px solid #eaf1f2;padding:16px 0;
    position:sticky;top:0;z-index:10;
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .brand{display:flex;align-items:center;}
  .brand img{height:40px;width:auto;display:block;}
  .back-link{
    font-weight:700;font-size:.98rem;color:var(--teal-deep);display:flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:100px;border:1.5px solid var(--teal);background:var(--teal-pale);
    transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .back-link:hover{background:var(--teal);color:#fff;transform:translateY(-2px);}
  .lang-switch{display:flex;align-items:center;gap:4px;background:var(--teal-pale);border-radius:100px;padding:3px;}
  .lang-btn{
    border:none;background:none;padding:6px 12px;border-radius:100px;font-weight:700;font-size:.8rem;
    color:var(--teal-deep);cursor:pointer;transition:background .2s var(--ease), color .2s var(--ease);
  }
  .lang-btn.active{background:var(--teal);color:#fff;}

  main{padding:56px 0 100px;}
  .page-title{font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(1.7rem,3.6vw,2.4rem);margin-bottom:8px;}
  .page-sub{color:#5c6b6e;margin-bottom:40px;}

  .checkout-flow{display:flex;flex-direction:column;gap:28px;max-width:640px;margin:0 auto;}
  .panel{background:#fff;border-radius:22px;padding:32px;box-shadow:var(--shadow);transition:opacity .3s var(--ease);}
  .panel h2{font-family:'Inter',sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:22px;color:var(--ink);}
  .section-hint{color:#5c6b6e;font-size:.88rem;margin-bottom:18px;line-height:1.5;}

  select, input[type="date"], input[type="text"], input[type="email"], input[type="tel"]{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #d8e8ea;
    font-size:.95rem;font-family:'Inter',sans-serif;color:var(--ink);background:#fff;
  }
  select:focus, input:focus{outline:none;border-color:var(--teal);}

  .btn-secondary{
    width:100%;padding:13px;border-radius:100px;border:1.5px solid var(--teal);background:#fff;color:var(--teal-deep);
    font-weight:600;font-size:.94rem;cursor:pointer;transition:background .25s var(--ease), color .25s var(--ease);margin-top:4px;
  }
  .btn-secondary:hover{background:var(--teal-pale);}
  .btn-secondary:disabled{opacity:.5;cursor:not-allowed;}

  .appt-service-summary{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 16px;border-radius:12px;background:var(--teal-pale);border:1.5px solid var(--teal-light);
  }
  .appt-service-summary .appt-service-name{font-weight:700;color:var(--ink);font-size:.95rem;}
  .appt-service-summary .appt-service-meta{font-size:.8rem;color:var(--teal-deep);font-weight:700;white-space:nowrap;}

  .date-picker-wrap{position:relative;}
  .date-picker-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-radius:12px;border:1.5px solid #d8e8ea;background:#fff;
    font-size:.95rem;font-family:'Inter',sans-serif;color:var(--ink);cursor:pointer;text-align:left;
  }
  .date-picker-btn:hover{border-color:var(--teal);}
  .date-picker-btn:disabled{opacity:.6;cursor:not-allowed;}
  .date-picker-icon{font-size:1.1rem;}
  .appt-calendar{
    position:absolute;top:calc(100% + 10px);left:0;z-index:20;
    background:#fff;border-radius:20px;box-shadow:var(--shadow);border:1px solid #eaf1f2;
    padding:22px;width:320px;max-width:90vw;
  }
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .cal-header span{font-weight:700;font-size:1.05rem;color:var(--ink);text-transform:capitalize;}
  .cal-nav{
    width:34px;height:34px;border-radius:50%;border:none;background:var(--teal-pale);color:var(--teal-deep);
    font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .cal-nav:hover:not(:disabled){background:var(--teal);color:#fff;}
  .cal-nav:disabled{opacity:.35;cursor:not-allowed;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
  .cal-weekdays span{text-align:center;font-size:.7rem;font-weight:700;color:#8b9a9c;text-transform:uppercase;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;
    border:none;background:transparent;font-size:.92rem;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .cal-day:hover:not(:disabled):not(.empty){background:var(--teal-pale);}
  .cal-day.selected{background:var(--teal);color:#fff;}
  .cal-day.today:not(.selected){border:1.5px solid var(--teal);}
  .cal-day:disabled{color:#d0dbdc;cursor:not-allowed;}
  .cal-day.empty{visibility:hidden;cursor:default;}

  .appt-slots{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .appt-slot-btn{
    padding:10px 16px;border-radius:100px;border:1.5px solid #d8e8ea;background:#fff;color:var(--ink);
    font-weight:600;font-size:.88rem;cursor:pointer;transition:all .2s var(--ease);
  }
  .appt-slot-btn:hover{border-color:var(--teal);}
  .appt-slot-btn.selected{background:var(--teal);border-color:var(--teal);color:#fff;}

  .appt-staff-picker{display:flex;flex-wrap:wrap;gap:10px;}
  .appt-staff-btn{
    padding:10px 16px;border-radius:100px;border:1.5px solid #d8e8ea;background:#fff;color:var(--ink);
    font-weight:600;font-size:.88rem;cursor:pointer;transition:all .2s var(--ease);
  }
  .appt-staff-btn:hover{border-color:var(--teal);}
  .appt-staff-btn.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
  .appt-staff-picker .appt-staff-empty{font-size:.85rem;color:#8b9a9c;}
  .appt-customer-form{margin-top:22px;padding-top:20px;border-top:1px dashed #e3edee;}
  .appt-confirmed{
    background:var(--teal-pale);border-radius:14px;padding:16px 18px;
    font-weight:600;color:var(--teal-deep);font-size:.92rem;
  }
  #appt-status{margin-top:16px;font-weight:600;font-size:.9rem;min-height:20px;}

  .order-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #f0f5f5;}
  .order-item-name{font-weight:600;font-size:.94rem;}
  .order-item-qty{font-size:.78rem;color:#8b9a9c;margin-top:2px;}
  .order-item-right{display:flex;align-items:center;gap:12px;}
  .order-item-controls{display:flex;align-items:center;gap:6px;}
  .qty-btn{
    width:26px;height:26px;border-radius:8px;border:1px solid #d8e8ea;background:#fff;color:var(--teal-deep);
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;
  }
  .qty-btn:hover{background:var(--teal-pale);}
  .qty-value{min-width:16px;text-align:center;font-weight:600;font-size:.88rem;}
  .order-item-price{font-weight:600;color:var(--teal-deep);font-family:'Inter',sans-serif;font-weight:700;white-space:nowrap;}
  .order-item-remove{background:none;border:none;cursor:pointer;font-size:1.3rem;line-height:1;opacity:.55;transition:opacity .2s var(--ease);}
  .order-item-remove:hover{opacity:1;}
  .order-total-row{
    display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:18px;
    border-top:2px solid var(--teal-pale);font-family:'Inter',sans-serif;font-weight:700;font-size:1.3rem;
  }
  .order-note{font-size:.78rem;color:#8b9a9c;margin-top:16px;line-height:1.5;}

  .pay-field{margin-bottom:18px;}
  .pay-field label{display:block;font-weight:600;font-size:.9rem;color:var(--ink);margin-bottom:8px;}
  #card-container{padding:2px;border-radius:12px;min-height:56px;}
  #card-button, #apptConfirmBtn{
    width:100%;padding:15px;border-radius:100px;border:none;background:var(--teal);color:#fff;
    font-family:'Inter',sans-serif;font-weight:600;font-size:1.02rem;cursor:pointer;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s;
    box-shadow:0 12px 30px rgba(46,196,182,.3);
  }
  #card-button:hover, #apptConfirmBtn:hover{background:var(--teal-dark);transform:translateY(-2px);}
  #card-button:disabled, #apptConfirmBtn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  #payment-status{margin-top:16px;font-weight:600;font-size:.92rem;min-height:20px;}
  .payment-note{text-align:center;font-size:.75rem;color:#8b9a9c;margin-top:16px;line-height:1.5;}
  .powered-by-light{text-align:center;padding:36px 0 10px;font-size:.8rem;color:#8b9a9c;}
  .powered-by-light b{font-family:'Forum',serif;font-weight:400;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal-deep);}

  .empty-state{
    text-align:center;background:#fff;border-radius:22px;padding:70px 30px;box-shadow:var(--shadow);
  }
  .empty-state span{font-size:3.4rem;display:block;margin-bottom:18px;}
  .empty-state h2{font-family:'Inter',sans-serif;font-weight:700;font-size:1.4rem;margin-bottom:10px;}
  .empty-state p{color:#5c6b6e;margin-bottom:26px;}
  .btn-primary{
    display:inline-flex;padding:14px 30px;border-radius:100px;background:var(--teal);color:#fff;
    font-weight:600;font-family:'Inter',sans-serif;font-weight:700;box-shadow:0 10px 26px rgba(46,196,182,.3);
    transition:transform .25s var(--ease), background .25s;
  }
  .btn-primary:hover{transform:translateY(-2px);background:var(--teal-dark);}

  .success-panel{text-align:center;padding:60px 30px;}
  .success-icon{
    width:70px;height:70px;border-radius:50%;background:var(--teal-pale);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;
  }
  .success-panel h2{font-family:'Inter',sans-serif;font-weight:700;font-size:1.6rem;margin-bottom:10px;}
  .success-panel p{color:#5c6b6e;margin-bottom:6px;}
  .success-panel a.receipt{color:var(--teal);font-weight:600;text-decoration:underline;}

</style>
</head>

<header>
  <div class="wrap">
    <a href="web-oh-my-wash.html" class="brand">

    <div class="header-actions">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en" aria-label="English">EN</button>
        <button class="lang-btn" data-lang="es" aria-label="Español">ES</button>
      </div>
      <a href="servicios.html" class="back-link" data-i18n="checkout.backToServices">‹ Volver a servicios</a>

</main>

  document.querySelectorAll('.lang-btn').forEach(b => {

    b.addEventListener('click', () => applyLanguage(b.dataset.lang));
  });

  function applyStaticTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (t()[key] != null) el.innerHTML = t()[key];

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {

  // Square. Por eso solo se actualizan textos de elementos ya existentes.
  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('ohMyWashLang', lang);
    applyStaticTranslations();
    if (typeof afterLanguageChange === 'function') afterLanguageChange();
  }
  let afterLanguageChange = null;

  // Si el navegador restaura esta página desde su caché (ej. el cliente le
  // dio "atrás" después de quitar algo del carrito en otra página), el
  // script no se vuelve a ejecutar y el carrito/total quedan con el valor
  // viejo aunque localStorage ya esté actualizado. Forzamos una recarga
  // real para que todo se recalcule desde el carrito actual.
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) window.location.reload();
  });

  const content = document.getElementById('checkoutContent');
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { cart = []; }

  const formatUSD = (n) => '$' + n.toFixed(2);
  const cartTotal = () => cart.reduce((sum, i) => sum + (i.price != null ? i.price * i.qty : 0), 0);

  if (!cart.length) {
    function renderEmpty() {
      content.innerHTML = `
        <div class="empty-state">
          <span>🛒</span>
          <h2 data-i18n="checkout.emptyTitle">${t()['checkout.emptyTitle']}</h2>
          <p data-i18n="checkout.emptyHint">${t()['checkout.emptyHint']}</p>
          <a href="servicios.html" class="btn-primary" data-i18n="checkout.emptyCta">${t()['checkout.emptyCta']}</a>
        </div>
      `;
    }
    afterLanguageChange = renderEmpty;
    renderEmpty();
    applyStaticTranslations();
    return;
  }

  let total = cartTotal();

  content.innerHTML = `
    <div class="checkout-flow" id="checkoutGrid">
      <div class="panel">
        <h2 data-i18n="checkout.orderSummary">Resumen de tu pedido</h2>
        <div id="orderItems"></div>
        <div class="order-total-row"><span data-i18n="checkout.totalLabel">Total</span><span id="orderTotal">${formatUSD(total)}</span></div>
        <p class="order-note" id="orderNote"></p>
      </div>

      <div class="panel">
        <h2 data-i18n="checkout.scheduleTitle">Agenda tu cita</h2>
        <p class="section-hint" data-i18n="checkout.scheduleHint">Elige el servicio principal, la fecha, y confirma un horario disponible con nuestro equipo.</p>
        <div class="pay-field">
          <label data-i18n="checkout.serviceLabel">Servicio</label>
          <div id="apptServiceSummary" class="appt-service-summary" data-i18n="checkout.loadingService">Cargando servicio...</div>
        </div>
        <div class="pay-field">
          <label data-i18n="checkout.dateLabel">Fecha</label>
          <div class="date-picker-wrap">
            <button type="button" id="apptDateBtn" class="date-picker-btn">
              <span id="apptDateLabel">Elige una fecha</span>
              <span class="date-picker-icon">📅</span>
            </button>
            <div id="apptCalendar" class="appt-calendar" hidden>
              <div class="cal-header">
                <button type="button" id="calPrev" class="cal-nav" data-i18n-aria="checkout.prevMonth" aria-label="Mes anterior">‹</button>
                <span id="calMonthLabel"></span>
                <button type="button" id="calNext" class="cal-nav" data-i18n-aria="checkout.nextMonth" aria-label="Mes siguiente">›</button>
              </div>
              <div class="cal-weekdays" id="calWeekdays"></div>
              <div id="calDays" class="cal-days"></div>
            </div>
          </div>
        </div>
        <div class="pay-field">
          <label data-i18n="checkout.technicianLabel">Técnico</label>
          <div id="apptStaffPicker" class="appt-staff-picker"></div>
        </div>
        <button id="apptSearchBtn" type="button" class="btn-secondary" data-i18n="checkout.searchSlots">Buscar horarios disponibles</button>
        <div id="apptSlots" class="appt-slots"></div>
        <div id="apptCustomerForm" class="appt-customer-form" hidden>
          <div class="pay-field"><label data-i18n="checkout.fullName">Nombre completo</label><input type="text" id="apptName" data-i18n-placeholder="checkout.namePlaceholder" placeholder="Tu nombre"></div>
          <div class="pay-field"><label data-i18n="checkout.email">Correo</label><input type="email" id="apptEmail" placeholder="tu@correo.com"></div>
          <div class="pay-field"><label data-i18n="checkout.phone">Teléfono</label><input type="tel" id="apptPhone" placeholder="+1 678 555 0100"></div>
          <div class="pay-field"><label data-i18n="checkout.addressLine1">Calle y número</label><input type="text" id="apptAddressLine1" placeholder="123 Main St"></div>
          <div class="pay-field"><label data-i18n="checkout.city">Ciudad</label><input type="text" id="apptCity" placeholder="Atlanta"></div>
          <div class="pay-field"><label data-i18n="checkout.state">Estado</label><input type="text" id="apptState" value="GA" maxlength="2"></div>
          <div class="pay-field"><label data-i18n="checkout.zip">Código postal</label><input type="text" id="apptZip" placeholder="30341" inputmode="numeric"></div>
          <button id="apptConfirmBtn" type="button" data-i18n="checkout.confirmAppt">Confirmar cita</button>
        </div>
        <p id="appt-status"></p>
      </div>

      <div class="panel" id="paymentPanel" style="opacity:.5;pointer-events:none;">
        <h2 data-i18n="checkout.paymentTitle">Datos de pago</h2>
        <p class="section-hint" id="paymentGateNote" data-i18n="checkout.paymentGateNote">Agenda tu cita arriba para habilitar el pago.</p>
        <div class="pay-field">
          <label data-i18n="checkout.cardLabel">Tarjeta</label>
          <div id="card-container"></div>
        </div>
        <button id="card-button" type="button"></button>
        <p id="payment-status"></p>
        <p class="payment-note" data-i18n="checkout.paymentNote">🔒 Pago seguro procesado por Square. Tus datos de tarjeta nunca pasan por nuestros servidores.</p>
      </div>
    </div>
  `;

  const API_BASE = 'https://oh-my-wash-server.onrender.com';
  const cardButton = document.getElementById('card-button');
  const paymentPanel = document.getElementById('paymentPanel');
  let bookingConfirmed = false;

  function updatePayButtonText() {
    cardButton.textContent = `${t()['checkout.payButton']} ${formatUSD(total)}`;
  }
  updatePayButtonText();

  function renderOrderNote() {
    document.getElementById('orderNote').textContent = cart.some(i => i.price == null)
      ? t()['checkout.orderNoteAddon']
      : t()['checkout.orderNotePlain'];
  }

  function renderOrderItems() {
    document.getElementById('orderItems').innerHTML = cart.map(i => `
      <div class="order-item">
        <div>
          <div class="order-item-name">${i.name}</div>
          <div class="order-item-qty">${i.price != null ? formatUSD(i.price) + ' c/u' : t()['checkout.variablePrice']}</div>
        </div>
        <div class="order-item-right">
          <div class="order-item-controls">
            <button class="qty-btn" data-name="${i.name.replace(/"/g, '&quot;')}" data-delta="-1" aria-label="${t()['checkout.removeOne']}">−</button>
            <span class="qty-value">${i.qty}</span>
            <button class="qty-btn" data-name="${i.name.replace(/"/g, '&quot;')}" data-delta="1" aria-label="${t()['checkout.addOne']}">+</button>
          </div>
          <div class="order-item-price">${i.price != null ? formatUSD(i.price * i.qty) : t()['checkout.variablePrice']}</div>
          <button class="order-item-remove" data-name="${i.name.replace(/"/g, '&quot;')}" aria-label="${t()['checkout.removeService']}">✕</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.order-item-remove').forEach(btn => {
      btn.addEventListener('click', () => removeCartItem(btn.dataset.name));
    });
    document.querySelectorAll('.order-item-controls .qty-btn').forEach(btn => {
      btn.addEventListener('click', () => changeOrderQty(btn.dataset.name, parseInt(btn.dataset.delta, 10)));
    });
  }

  function refreshAfterCartChange() {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    total = cartTotal();
    renderOrderItems();
    renderOrderNote();
    document.getElementById('orderTotal').textContent = formatUSD(total);
    if (cardButton) updatePayButtonText();
    loadApptServices();
  }

  function changeOrderQty(name, delta) {
    const item = cart.find(i => i.name === name);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      cart = cart.filter(i => i.name !== name);
      if (!cart.length) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); window.location.reload(); return; }
    }
    refreshAfterCartChange();
  }

  function removeCartItem(name) {
    cart = cart.filter(i => i.name !== name);
    if (!cart.length) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      window.location.reload();
      return;
    }
    refreshAfterCartChange();
  }

  renderOrderItems();
  renderOrderNote();

  // ---------- Agenda tu cita ----------
  let apptServices = [];
  let apptAvailabilities = [];
  let apptSelectedIndex = null;

  const apptServiceSummary = document.getElementById('apptServiceSummary');
  const apptSearchBtn = document.getElementById('apptSearchBtn');
  const apptSlotsEl = document.getElementById('apptSlots');
  const apptCustomerForm = document.getElementById('apptCustomerForm');
  const apptConfirmBtn = document.getElementById('apptConfirmBtn');
  const apptStatusEl = document.getElementById('appt-status');

  function setApptStatus(html, kind) {
    apptStatusEl.innerHTML = html;
    apptStatusEl.style.color = kind === 'error' ? '#c0392b' : kind === 'ok' ? '#1d8a4a' : '#5c6b6e';
  }

  // ---------- Calendario personalizado ----------
  const apptDateBtn = document.getElementById('apptDateBtn');
  const apptDateLabel = document.getElementById('apptDateLabel');
  const apptCalendar = document.getElementById('apptCalendar');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const calWeekdays = document.getElementById('calWeekdays');
  const calDays = document.getElementById('calDays');
  const calPrev = document.getElementById('calPrev');
  const calNext = document.getElementById('calNext');

  const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
  const minDate = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate());
  let selectedDate = new Date(minDate);
  let calViewDate = new Date(minDate.getFullYear(), minDate.getMonth(), 1);

  const toDateStr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const dateLocale = () => currentLang === 'en' ? 'en-US' : 'es-ES';

  function renderWeekdayHeaders() {
    calWeekdays.innerHTML = t()['checkout.weekdays'].map(w => `<span>${w}</span>`).join('');
  }

  function updateDateLabel() {
    apptDateLabel.textContent = selectedDate.toLocaleDateString(dateLocale(), { weekday: 'long', day: 'numeric', month: 'long' });
  }
  updateDateLabel();

  // ---------- Selector de técnico ----------
  // Cada técnico solo trabaja ciertos días/horas (acordado con el negocio,
  // no algo que Square sepa por sí solo — Square solo conoce el horario
  // general del local y las citas ya reservadas). Por eso filtramos aquí
  // quién se puede elegir según el día de la semana, y a la hora de buscar
  // disponibilidad le pedimos a Square el calendario de esa persona en
  // concreto, recortando además cualquier horario que se pase de su hora
  // de salida (relevante sobre todo para Miguel, que corta a las 2pm).
  const STAFF_SCHEDULE = {
    'TMqtFAlpFqDV-l_j': { name: 'JP', days: [0, 1, 2, 3, 4, 5, 6], startMin: 9 * 60, endMin: 17 * 60 },
    'TMP0GRLy0FkLW_bt': { name: 'Jose Castro', days: [6], startMin: 9 * 60, endMin: 17 * 60 },
    'TMhQVvzCRfnsr5Bf': { name: 'Miguel Alvarado', days: [5], startMin: 9 * 60, endMin: 14 * 60 },
  };
  const apptStaffPicker = document.getElementById('apptStaffPicker');
  let selectedStaffId = null;

  function renderStaffPicker() {
    const dow = selectedDate.getDay();
    const eligible = Object.entries(STAFF_SCHEDULE).filter(([, s]) => s.days.includes(dow));

    if (!eligible.length) {
      apptStaffPicker.innerHTML = `<span class="appt-staff-empty">${t()['checkout.noTechToday']}</span>`;
      selectedStaffId = null;
      return;
    }

    if (!eligible.some(([id]) => id === selectedStaffId)) {
      selectedStaffId = eligible[0][0];
    }

    apptStaffPicker.innerHTML = eligible.map(([id, s]) => `
      <button type="button" class="appt-staff-btn${id === selectedStaffId ? ' selected' : ''}" data-id="${id}">${s.name}</button>
    `).join('');

    apptStaffPicker.querySelectorAll('.appt-staff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedStaffId = btn.dataset.id;
        apptStaffPicker.querySelectorAll('.appt-staff-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  }
  renderStaffPicker();

  function nyMinutesOfDay(date) {
    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false });
    const parts = fmt.formatToParts(date);
    const h = parseInt(parts.find(p => p.type === 'hour').value, 10) % 24;
    const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
    return h * 60 + m;
  }

  function renderCalendar() {
    calMonthLabel.textContent = calViewDate.toLocaleDateString(dateLocale(), { month: 'long', year: 'numeric' });
    renderWeekdayHeaders();

    const year = calViewDate.getFullYear();
    const month = calViewDate.getMonth();
    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = '';
    for (let i = 0; i < startWeekday; i++) html += `<button type="button" class="cal-day empty" disabled></button>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(year, month, d);
      const dStr = toDateStr(dateObj);
      const disabled = dateObj < minDate;
      const isSelected = dStr === toDateStr(selectedDate);
      const isToday = dStr === toDateStr(new Date());
      html += `<button type="button" class="cal-day${isSelected ? ' selected' : ''}${isToday ? ' today' : ''}" data-date="${dStr}"${disabled ? ' disabled' : ''}>${d}</button>`;
    }
    calDays.innerHTML = html;

    calPrev.disabled = (year === minDate.getFullYear() && month === minDate.getMonth());

    calDays.querySelectorAll('.cal-day[data-date]:not(:disabled)').forEach(btn => {
      btn.addEventListener('click', () => {
        const [y, m, day] = btn.dataset.date.split('-').map(Number);
        selectedDate = new Date(y, m - 1, day);
        updateDateLabel();
        renderStaffPicker();
        apptCalendar.hidden = true;
        renderCalendar();
      });
    });
  }

  apptDateBtn.addEventListener('click', () => {
    apptCalendar.hidden = !apptCalendar.hidden;
    if (!apptCalendar.hidden) renderCalendar();
  });
  calPrev.addEventListener('click', () => { calViewDate.setMonth(calViewDate.getMonth() - 1); renderCalendar(); });
  calNext.addEventListener('click', () => { calViewDate.setMonth(calViewDate.getMonth() + 1); renderCalendar(); });
  document.addEventListener('click', (e) => {
    if (apptCalendar.hidden) return;
    if (!apptCalendar.contains(e.target) && e.target !== apptDateBtn && !apptDateBtn.contains(e.target)) {
      apptCalendar.hidden = true;
    }
  });

  async function loadApptServices() {
    try {
      apptServiceSummary.textContent = t()['checkout.loadingServices'];
      const res = await fetch(`${API_BASE}/services`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      const allServices = data.services || [];

      // Por cada producto del carrito buscamos SU variacion exacta en Square
      // comparando "bolsas de palabras" (nombre del item + talla/variacion),
      // no el string completo: en Square las tallas viven como variaciones
      // dentro de un mismo item (ej. "ALL IN ONE" con variaciones "SUV",
      // "SMALL CARS", "BIG SUV/TRUCK"), y el orden/idioma de las palabras no
      // siempre coincide con el nombre en la web (ej. "Ceramic Coating - 2
      // years/anos" en la web vs "2 years Ceramic coating Without paint
      // correction:" en Square). Comparar el string completo hacia "match"
      // con varias tallas a la vez (pedia disponibilidad para todas juntas)
      // o directamente no encontraba nada.
      // Se cuentan palabras clave en comun (ignorando acentos y conectores,
      // y traduciendo "años/year(s)" y "corrección/correction" entre
      // idiomas) y, si hay mas de un candidato con suficientes palabras en
      // comun, se usa el precio (identico en ambos idiomas) para desempatar.
      const TRANSLATE = { anos: 'years', ano: 'years', years: 'years', correccion: 'correction', correction: 'correction' };
      const STOPWORDS = new Set(['oh', 'my', 'wash', 'with', 'without', 'de', 'la', 'el', 'y', 'and']);
      const words = (str) => str
        .toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .split(' ')
        .filter(Boolean)
        .map(w => TRANSLATE[w] || w)
        .filter(w => !STOPWORDS.has(w));
      const overlap = (a, b) => { const bSet = new Set(b); return a.filter(w => bSet.has(w)).length; };

      const matched = cart
        .map(item => {
          const itemWords = words(item.name);
          const candidates = allServices
            .map(s => ({ s, score: overlap(itemWords, words(`${s.serviceName} ${s.variationName}`)) }))
            .filter(x => x.score >= 2)
            .sort((a, b) => b.score - a.score);
          if (!candidates.length) return null;
          const best = candidates.find(x => x.s.price === item.price) || candidates[0];
          return { ...best.s, qty: item.qty };
        })
        .filter(Boolean);
      apptServices = matched.length ? matched : allServices.map(s => ({ ...s, qty: 1 }));

      if (!apptServices.length) {
        apptServiceSummary.textContent = t()['checkout.noBookableServices'];
        return;
      }
      apptServiceSummary.innerHTML = apptServices.map(s => `
        <span class="appt-service-name">${s.serviceName}${s.qty > 1 ? ` ×${s.qty}` : ''}</span>
        <span class="appt-service-meta">${s.price != null ? '$' + s.price.toFixed(2) : t()['checkout.priceToConfirm']} · ${s.durationMinutes} min${s.qty > 1 ? ' c/u' : ''}</span>
      `).join('<hr style="width:100%;border:none;border-top:1px dashed var(--teal-light);margin:2px 0;">');
    } catch (err) {
      console.error(err);
      apptServiceSummary.textContent = t()['checkout.couldNotLoadServices'];
    }
  }
  loadApptServices();

  apptSearchBtn.addEventListener('click', async () => {
    if (!apptServices.length) { setApptStatus(t()['checkout.noServicesToSchedule'], 'error'); return; }
    if (!selectedStaffId) { setApptStatus(t()['checkout.noTechSelectDate'], 'error'); return; }
    const dateVal = toDateStr(selectedDate);

    setApptStatus(t()['checkout.searchingSlots'], 'info');
    apptSlotsEl.innerHTML = '';
    apptCustomerForm.hidden = true;
    apptSelectedIndex = null;
    apptSearchBtn.disabled = true;

    const startAt = `${dateVal}T00:00:00Z`;
    const endDate = new Date(`${dateVal}T00:00:00Z`);
    endDate.setUTCDate(endDate.getUTCDate() + 1);
    const endAt = endDate.toISOString();

    try {
      const res = await fetch(`${API_BASE}/availability`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          serviceVariationIds: apptServices.flatMap(s => Array(s.qty || 1).fill(s.serviceVariationId)),
          teamMemberId: selectedStaffId,
          startAt,
          endAt,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);

      // Square ya filtra por el horario general del local (9am-5pm) y las
      // citas reales del técnico elegido, pero algunos técnicos salen antes
      // (ej. Miguel a las 2pm) — eso lo recortamos aquí, comparando cuándo
      // terminaría la cita (inicio + duración total) contra su hora de salida.
      const totalDuration = apptServices.reduce((sum, s) => sum + s.durationMinutes * (s.qty || 1), 0);
      const staffCfg = STAFF_SCHEDULE[selectedStaffId];
      apptAvailabilities = (data.availabilities || []).filter(a => {
        const endsAt = new Date(new Date(a.startAt).getTime() + totalDuration * 60000);
        return nyMinutesOfDay(endsAt) <= staffCfg.endMin;
      });

      if (!apptAvailabilities.length) {
        setApptStatus(t()['checkout.noSlotsThatDay'], 'error');
        return;
      }

      apptSlotsEl.innerHTML = apptAvailabilities
        .map((a, i) => {
          const time = new Date(a.startAt).toLocaleTimeString(currentLang === 'en' ? 'en-US' : 'es-US', { hour: 'numeric', minute: '2-digit' });
          return `<button type="button" class="appt-slot-btn" data-index="${i}">${time}</button>`;
        })
        .join('');
      setApptStatus('', 'info');

      document.querySelectorAll('.appt-slot-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.appt-slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          apptSelectedIndex = parseInt(btn.dataset.index, 10);
          apptCustomerForm.hidden = false;
        });
      });
    } catch (err) {
      console.error(err);
      setApptStatus(`❌ ${err.message}`, 'error');
    } finally {
      apptSearchBtn.disabled = false;
    }
  });

  apptConfirmBtn.addEventListener('click', async () => {
    if (apptSelectedIndex == null) { setApptStatus(t()['checkout.chooseTimeFirst'], 'error'); return; }
    const name = document.getElementById('apptName').value.trim();
    if (!name) { setApptStatus(t()['checkout.writeYourName'], 'error'); return; }
    const email = document.getElementById('apptEmail').value.trim();
    const phone = document.getElementById('apptPhone').value.trim();
    const addressLine1 = document.getElementById('apptAddressLine1').value.trim();
    const city = document.getElementById('apptCity').value.trim();
    const state = document.getElementById('apptState').value.trim();
    const zip = document.getElementById('apptZip').value.trim();
    if (!addressLine1 || !city || !zip) { setApptStatus(t()['checkout.completeAddress'], 'error'); return; }

    const slot = apptAvailabilities[apptSelectedIndex];
    const segments = slot.appointmentSegments;

    setApptStatus(t()['checkout.confirmingAppt'], 'info');
    apptConfirmBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/create-booking`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          segments: segments.map(s => ({
            serviceVariationId: s.serviceVariationId,
            serviceVariationVersion: s.serviceVariationVersion,
            teamMemberId: s.teamMemberId,
            durationMinutes: s.durationMinutes,
          })),
          startAt: slot.startAt,
          customerName: name,
          customerEmail: email || undefined,
          customerPhone: phone || undefined,
          addressLine1,
          locality: city,
          administrativeDistrictLevel1: state || undefined,
          postalCode: zip,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);

      const dateStr = new Date(slot.startAt).toLocaleString(dateLocale(), {
        weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit',
      });
      setApptStatus(`<div class="appt-confirmed">✅ ${t()['checkout.apptConfirmedFor']} ${dateStr}</div>`, 'ok');

      bookingConfirmed = true;
      paymentPanel.style.opacity = '1';
      paymentPanel.style.pointerEvents = 'auto';
      document.getElementById('paymentGateNote').textContent = t()['checkout.apptAlreadyScheduled'];
      apptSearchBtn.disabled = true;
      apptDateBtn.disabled = true;
    } catch (err) {
      console.error(err);
      setApptStatus(`❌ ${err.message}`, 'error');
      apptConfirmBtn.disabled = false;
    }
  });

  const statusEl = document.getElementById('payment-status');

  function setStatus(html, kind) {
    if (!statusEl) return;
    statusEl.innerHTML = html;
    statusEl.style.color = kind === 'error' ? '#c0392b' : kind === 'ok' ? '#1d8a4a' : '#5c6b6e';
  }

  function showSuccess(data) {
    const receiptLink = data.receiptUrl
      ? `<p><a class="receipt" href="${data.receiptUrl}" target="_blank" rel="noopener">${t()['checkout.viewReceipt']}</a></p>`
      : '';
    const paymentLine = data.paymentId ? `<p>${t()['checkout.paymentIdLabel']} ${data.paymentId}</p>` : '';
    document.getElementById('checkoutGrid').innerHTML = `
      <div class="panel success-panel">
        <div class="success-icon">✓</div>
        <h2>${data.paymentId ? t()['checkout.paymentReceived'] : t()['checkout.apptConfirmedTitle']}</h2>
        ${paymentLine}
        <p>${t()['checkout.totalCharged']} ${formatUSD(total)}</p>
        ${receiptLink}
        <p style="margin-top:22px;"><a href="web-oh-my-wash.html" class="btn-primary">${t()['checkout.backToHome']}</a></p>
      </div>
    `;
    localStorage.removeItem(CART_KEY);
  }

  async function initSquarePayments() {
    if (!window.Square) {
      setStatus(t()['checkout.sdkLoadError'], 'error');
      if (cardButton) cardButton.disabled = true;
      return;
    }

    let card;
    try {
      const payments = window.Square.payments(SQUARE_APP_ID, SQUARE_LOCATION_ID);
      card = await payments.card();
      await card.attach('#card-container');
    } catch (err) {
      console.error('No se pudo inicializar el formulario de tarjeta:', err);
      setStatus(t()['checkout.cardFormError'], 'error');
      if (cardButton) cardButton.disabled = true;
      return;
    }

    cardButton.addEventListener('click', async () => {
      if (!bookingConfirmed) {
        setStatus(t()['checkout.scheduleBeforePay'], 'error');
        return;
      }
      // Se vuelve a leer el carrito real de localStorage justo antes de
      // cobrar (no se confía en la variable "total" ya calculada): si algo
      // se quitó del carrito en otra pestaña/página después de cargar esta,
      // el monto que se cobra debe reflejar el carrito actual, no uno viejo.
      let freshCart = [];
      try { freshCart = JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { freshCart = []; }
      total = freshCart.reduce((sum, i) => sum + (i.price != null ? i.price * i.qty : 0), 0);

      if (total <= 0) {
        setStatus(t()['checkout.noChargeConfirmed'], 'ok');
        showSuccess({ paymentId: null, receiptUrl: null });
        return;
      }

      setStatus(t()['checkout.processing'], 'info');
      cardButton.disabled = true;
      try {
        const amountCents = Math.round(total * 100);
        const tokenResult = await card.tokenize();
        if (tokenResult.status !== 'OK') {
          throw new Error(tokenResult.errors?.[0]?.message || t()['checkout.cardError']);
        }

        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourceId: tokenResult.token, amount: amountCents }),
        });
        const data = await res.json();

        if (data.success) {
          setStatus(t()['checkout.paymentSuccess'], 'ok');
          showSuccess(data);
        } else {
          throw new Error(data.error || t()['checkout.paymentRejected']);
        }
      } catch (err) {
        console.error(err);
        setStatus(`❌ ${err.message}`, 'error');
      } finally {
        cardButton.disabled = false;
      }
    });
  }

  initSquarePayments();

  afterLanguageChange = () => {
    updatePayButtonText();
    renderOrderItems();
    renderOrderNote();
    renderWeekdayHeaders();
    updateDateLabel();
    if (!apptCalendar.hidden) renderCalendar();
    renderStaffPicker();
    loadApptServices();
  };
  applyStaticTranslations();
  renderWeekdayHeaders();
})();
</script>

</body>
</html>
